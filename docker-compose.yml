services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"   # para conectarte desde tu máquina (IDE, kafka-console-*)
    environment:
      # KRaft: Kafka sin Zookeeper, un solo nodo que hace de broker y controller.
      CLUSTER_ID: "q1Sh-9_ISia_zwGINzRvyQ"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL lo usan los contenedores (kafka:29092), EXTERNAL tu máquina (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5433:5432"   # 5433 en tu máquina para no chocar con un Postgres local
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer
    ports:
      - "8085:8080"   # UI web para ver las tablas (servidor: postgres, usuario/clave: shop/shop)
    depends_on:
      - postgres

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Todos los tokens llevan este issuer, se pidan desde tu máquina o desde dentro de Docker.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro   # realm "shop" con los usuarios demo

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  order-service:
    build: { context: ., args: { SERVICE: order-service } }
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      DB_HOST: postgres
      KEYCLOAK_JWKS: http://keycloak:8080/realms/shop/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  inventory-service:
    build: { context: ., args: { SERVICE: inventory-service } }
    ports:
      - "8082:8082"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      DB_HOST: postgres
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  payment-service:
    build: { context: ., args: { SERVICE: payment-service } }
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      DB_HOST: postgres
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  notification-service:
    build: { context: ., args: { SERVICE: notification-service } }
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  pgdata:
