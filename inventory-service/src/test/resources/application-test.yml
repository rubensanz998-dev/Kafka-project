# Tests sin infraestructura: H2 en modo PostgreSQL (Flyway aplica las mismas migraciones) y sin conectar a Kafka.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  kafka:
    listener:
      auto-startup: false
    admin:
      auto-create: false
outbox:
  scheduling:
    enabled: false
